<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Remo Oostdam — CV</title>
  <meta name="description" content="Curriculum Vitae of Remo Oostdam, PhD Candidate in Finance at the University of Amsterdam."/>

  <!-- Favicons -->
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="apple-touch-icon" href="assets/apple-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&amp;display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/style.css">

  <style>
    /* ---- Page-specific: CV ---- */

    body { --measure: 820px; }

    .cv-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px 24px;
      margin-bottom: 20px;
    }

    .cv-header h1 {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }

    .cv-updated { font-size: 13.5px; color: var(--muted); }

    .cv-embed-wrapper {
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    .cv-embed {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1.32;   /* roughly A4, so it scales with the column */
      border: none;
    }

    /* Phone fallback. iOS Safari renders only the first page of a PDF inside
       an iframe and will not scroll it, so below this width we drop the dead
       box and leave the download button as the way in. */

    .cv-fallback { display: none; }

    @media (max-width: 700px) {
      .cv-embed-wrapper { display: none; }

      .cv-fallback {
        display: block;
        font-size: 14.5px;
        line-height: 1.6;
        color: var(--muted);
        margin: 0;
      }

      .cv-header {
        align-items: flex-start;
        flex-direction: column-reverse;   /* button first, then the label */
        gap: 16px;
        margin-bottom: 14px;
      }
    }
  </style>
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-top">
      <div>
        <div class="sidebar-name">Remo Oostdam</div>
        <div class="sidebar-role">PhD Candidate in Finance</div>
      </div>

      <nav class="sidebar-nav" aria-label="Main">
        <a class="sidebar-link" href="index.html">Home</a>
        <a class="sidebar-link" href="cv.html" aria-current="page">CV</a>
        <a class="sidebar-link" href="curiosity.html">Curiosity</a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <div class="uva-contact-row">
        <a href="https://www.uva.nl/en" target="_blank" class="uva-logo" rel="noopener">
          <img src="assets/uva.svg" alt="University of Amsterdam">
        </a>
        <div class="sidebar-contact">
          <a href="https://www.linkedin.com/in/remo-oostdam/" target="_blank" rel="noopener">LinkedIn</a>
          <a class="js-email" data-user="r.p.oostdam" data-domain="uva.nl" href="#" rel="nofollow">r.p.oostdam at uva.nl</a>
        </div>
      </div>
      <span class="sidebar-copy">© <span class="js-year"></span> Remo Oostdam</span>
    </div>
  </aside>

  <div class="content-wrap">

    <div class="cv-header">
      <div>
        <h1>Curriculum Vitae</h1>
        <!-- TODO: update this date whenever you replace the PDF -->
        <div class="cv-updated">Last updated: August 2026</div>
      </div>

      <a class="btn-download" href="Remo_Oostdam_CV.pdf" download="Remo_Oostdam_CV.pdf">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 1.5v9"/>
          <path d="M4.5 7.5 8 11l3.5-3.5"/>
          <path d="M2 13.5h12"/>
        </svg>
        Download PDF
      </a>
    </div>

    <!-- Desktop / tablet: inline preview -->
    <div class="cv-embed-wrapper">
      <iframe class="cv-embed"
              src="Remo_Oostdam_CV.pdf#view=FitH"
              title="Curriculum Vitae of Remo Oostdam"></iframe>
    </div>

    <!-- Phone: mobile browsers cannot reliably preview a PDF inline -->
    <p class="cv-fallback">
      Mobile browsers cannot reliably preview a PDF in the page — use the button above
      to open the full CV.
    </p>
  </div>
</div>


<script src="assets/site.js" defer></script>
</body>
</html>
